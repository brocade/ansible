- name: Apply template initial switch configuration
  hosts: san_eng_zone_seed_san_a
  gather_facts: false

  vars:
    credential:
      fos_ip_addr: "{{ fos_ip_addr }}"
      fos_user_name: "{{ fos_user_name }}"
      fos_password: "{{ fos_password }}"
      https: "{{ fos_https }}"

  tasks:
    - name: Disable switch before settings some attributes that require switch disable
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-fibrechannel-switch"
        list_name: "fibrechannel-switch"
        entries:
          - enabled_state: false

    - name: Switch configuration
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-fibrechannel-switch"
        list_name: "fibrechannel-switch"
        entries:
          - user_friendly_name: "switch_name"
            fabric_user_friendly_name: "fabric_name"
            domain_id: 1
            banner: "AUTHORIZED USERS ONLY"
            dynamic_load_sharing: "lossless-dls"
            dns_servers:
              dns_server:
                - "x.x.x.x"
                - "x.x.x.x"

    - name: Switch configuration
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-fibrechannel-switch"
        list_name: "fibrechannel-switch"
        entries:
          - user_friendly_name: "switch_name"
            fabric_user_friendly_name: "fabric_name"
            domain_id: 1
            banner: "AUTHORIZED USERS ONLY"
            dynamic_load_sharing: "lossless-dls"
            dns_servers:
              dns_server:
                - "198.51.100.1"
                - "198.51.100.1"

    - name: Switch domain name configuration
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-fibrechannel-switch"
        list_name: "fibrechannel-switch"
        entries:
          - domain_name: "example.com"

    - name: Fabric configuration
      brocade_singleton_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-fibrechannel-configuration"
        obj_name: "fabric"
        attributes:
          insistent_domain_id_enabled: true
          in_order_delivery_enabled: false
          fabric_principal_enabled: true
          fabric_principal_priority: "0x3"
      register: result

  # - debug: var=result

    - name: >
        Port configuration. if running on a platform where credit recovery is
        supported, the line can be uncommented to update the mode.
      brocade_singleton_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-fibrechannel-configuration"
        obj_name: "port-configuration"
        attributes:
          dynamic_portname_format: "I.T.A.R"
          portname_mode: "dynamic"
              # credit_recovery_mode: "onLrOnly"

    - name: Enable switch after settings some attributes that require switch disable
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-fibrechannel-switch"
        list_name: "fibrechannel-switch"
        entries:
          - enabled_state: true

    - name: Chassis configuration
      brocade_singleton_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-chassis"
        obj_name: "chassis"
        attributes:
          chassis_user_friendly_name: "chassis_name"
        # shell_timeout is the REST name for telnet_timeout
          telnet_timeout: 30

    - name: FC ports configuration
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-interface"
        list_name: "fibrechannel"
        all_entries: false
        entries:
          - name: "0/0"
            enabled_state: false
            npiv_pp_limit: 126
          - name: "0/1"
            persistent_disable: true

    - name: Pause to make sure ports are configured
      ansible.builtin.pause:
        seconds: 15

    - name: Zoning configuration
      brocade_zoning_default_zone:
        credential: "{{ credential }}"
        vfid: -1
        default_zone_access: allaccess

    # if using IP addresses that are not available as clock servers
    # the module may timeout returning failure
    - name: Clock server configuration
      brocade_singleton_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-time"
        obj_name: "clock-server"
        attributes:
          ntp_server_address:
            server_address:
              - "203.0.113.20"

    - name: Time zone configuration
      brocade_singleton_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-time"
        obj_name: "time-zone"
        attributes:
          name: "America/Chicago"

    - name: Audit configuration
      brocade_singleton_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-logging"
        obj_name: "audit"
        attributes:
          audit_enabled: true
          filter_class_list:
            filter_class:
              - "zone"
              - "security"
              - "configuration"
              - "firmware"
              - "fabric"
              - "ls"
              - "cli"
              - "maps"
          severity_level: "info"

    - name: Syslog configuration
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-logging"
        list_name: "syslog-server"
        entries:
          - port: 514
            secure_mode: false
            server: "198.51.100.1"

    - name: SNMP system configuration
      brocade_singleton_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-snmp"
        obj_name: "system"
        attributes:
          audit_interval: 60
          contact: "Field Support."
          description: "DemoSwitch"
          encryption_enabled: false
          informs_enabled: true
          location: "Data Center 1"
          security_get_level_string: "authentication-and-privacy"
          security_set_level_string: "authentication-and-privacy"


    - name: SNMP v3 accounts - setup non-password attributes
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-snmp"
        list_name: "v3-account"
        all_entries: false
        entries:
          - index: 1
            authentication_protocol: "sha512"
            manager_engine_id: "00:00:00:00:00:00:00:00:00"
            privacy_protocol: "aes128"
            user_name: "asc-test"
          - index: 2
            authentication_protocol: "sha512"
            manager_engine_id: "00:00:00:00:00:00:00:00:00"
            privacy_protocol: "aes128"
            user_name: "user_name"

    - name: SNMP v3 traps
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-snmp"
        list_name: "v3-trap"
        entries:
          - trap_index: 1
            host: "198.51.100.2"
            informs_enabled: true
            port_number: 1011
            trap_severity_level: "warning"
            usm_index: 1
          - trap_index: 2
            host: "198.51.100.1"
            informs_enabled: false
            port_number: xxxx
            trap_severity_level: "critical"
            usm_index: 2
          - trap_index: 3
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 3
          - trap_index: 4
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 4
          - trap_index: 5
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 5
          - trap_index: 6
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 6

    - name: Ipfilter policy is created or present
      brocade_security_ipfilter_policy:
        credential: "{{ credential }}"
        vfid: -1
        ipfilter_policies:
          - name: "Ipv4_telnet_http"
            ip_version: "IPv4"

    - name: Ipfilter rules are created or present
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-security"
        list_name: "ipfilter-rule"
        all_entries: false
        entries:
          - policy_name: "ipv4_telnet_http"
            index: 1
            destination_end_port: 22
            destination_ip: "any"
            destination_start_port: 22
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 2
            destination_end_port: 23
            destination_ip: "any"
            destination_start_port: 23
            permission: "deny"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 3
            destination_end_port: 80
            destination_ip: "any"
            destination_start_port: 80
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 4
            destination_end_port: 443
            destination_ip: "any"
            destination_start_port: 443
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 5
            destination_end_port: 161
            destination_ip: "any"
            destination_start_port: 161
            permission: "permit"
            protocol: "udp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 6
            destination_end_port: 123
            destination_ip: "any"
            destination_start_port: 123
            permission: "permit"
            protocol: "udp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 7
            destination_end_port: xxxx
            destination_ip: "any"
            destination_start_port: xxx
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 8
            destination_end_port: xxxx
            destination_ip: "any"
            destination_start_port: xxx
            permission: "permit"
            protocol: "udp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 9
            destination_end_port: xxx
            destination_ip: "any"
            destination_start_port: xxx
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 10
            destination_end_port: xxx
            destination_ip: "any"
            destination_start_port: xxx
            permission: "permit"
            protocol: "udp"
            source_ip: "any"

    - name: Ipfilter policy is activated or active already
      brocade_security_ipfilter_policy:
        credential: "{{ credential }}"
        vfid: -1
        active_policy: "ipv4_telnet_http"

    - name: Disable root & user, and add new accounts
      brocade_list_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-security"
        list_name: "user-config"
        all_entries: false
        entries:
          - name: "User"
            account_enabled: false
          - name: "Root"
            account_enabled: false
          - name: "Myaccount"
            password: "user_password"
            virtual_fabric_role_id_list:
              role_id:
                - "admin=1-128"
            chassis_access_role: "admin"
          - name: "Youraccount"
            password: "user_password"
            virtual_fabric_role_id_list:
              role_id:
                - "admin=1-128"
            chassis_access_role: "admin"

    - name: Configure relay server
      brocade_singleton_obj:
        credential: "{{ credential }}"
        vfid: -1
        module_name: "brocade-maps"
        obj_name: "maps-config"
        attributes:
          relay_ip_address: "198.51.100.1"
          domain_name: "domain1.example.com"
          sender_address: "sender@domain1.example.com"
          recipient_address_list:
            recipient_address:
              - "receiver@domain1.example.com"
