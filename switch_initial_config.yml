- name: Apply initial switch configuration
  hosts: san_eng_zone_seed_san_a
  gather_facts: false

  vars:
    credential:
      fos_ip_addr: "{{ fos_ip_addr }}"
      fos_user_name: "{{ fos_user_name }}"
      fos_password: "{{ fos_password }}"
      https: "{{ fos_https }}"

  tasks:
    - name: Disable switch before settings some attributes that require switch disable
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          enabled_state: false

    - name: Switch configuration
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          user_friendly_name: "switch_name"
          fabric_user_friendly_name: "fabric_name"
          domain_id: 1
          banner: "AUTHORIZED USERS ONLY"
          dynamic_load_sharing: "lossless-dls"
          dns_servers:
            dns_server:
              - "8.8.8.8"
              - "8.8.4.4"

    - name: Switch configuration
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          user_friendly_name: "switch_name"
          fabric_user_friendly_name: "fabric_name"
          domain_id: 1
          banner: "AUTHORIZED USERS ONLY"
          dynamic_load_sharing: "lossless-dls"
          dns_servers:
            dns_server:
              - "203.0.113.30"
              - "203.0.113.31"

    - name: Switch domain name configuration
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          domain_name: "example.com"

    - name: Fabric configuration
      brocade_fibrechannel_configuration_fabric:
        credential: "{{ credential }}"
        vfid: -1
        fabric:
          insistent_domain_id_enabled: true
          in_order_delivery_enabled: false
          fabric_principal_enabled: true
          fabric_principal_priority: "0x3"
      register: result

  # - debug: var=result

    - name: >
        Port configuration. if running on a platform where credit recovery is
        supported, the line can be uncommented to update the mode.
      brocade_fibrechannel_configuration_port_configuration:
        credential: "{{ credential }}"
        vfid: -1
        port_configuration:
          dynamic_portname_format: "I.T.A.R"
          portname_mode: "dynamic"
              # credit_recovery_mode: "onLrOnly"

    - name: Enable switch after settings some attributes that require switch disable
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          enabled_state: true

    - name: Chassis configuration
      brocade_chassis:
        credential: "{{ credential }}"
        vfid: -1
        chassis:
          chassis_user_friendly_name: "chassis_name"

    - name: FC ports configuration
      brocade_interface_fibrechannel:
        credential: "{{ credential }}"
        vfid: -1
        ports:
          - name: "0/0"
            enabled_state: false
            npiv_pp_limit: 126
          - name: "0/1"
            persistent_disable: true

    - name: Pause to make sure ports are configured
      ansible.builtin.pause:
        seconds: 15

    - name: Zoning configuration
      brocade_zoning_default_zone:
        credential: "{{ credential }}"
        vfid: -1
        default_zone_access: allaccess

    # if using IP addresses that are not available as clock servers
    # the module may timeout returning failure
    - name: Clock server configuration
      brocade_time_clock_server:
        credential: "{{ credential }}"
        vfid: -1
        clock_server:
          ntp_server_address:
            server_address:
              - "203.0.113.20"

    - name: Time zone configuration
      brocade_time_time_zone:
        credential: "{{ credential }}"
        vfid: -1
        time_zone:
          name: "Etc/UTC"

    - name: Audit configuration
      brocade_logging_audit:
        credential: "{{ credential }}"
        vfid: -1
        audit:
          audit_enabled: true
          filter_class_list:
            filter_class:
              - "zone"
              - "security"
              - "configuration"
              - "firmware"
              - "fabric"
              - "ls"
              - "cli"
              - "maps"
          severity_level: "info"

    - name: Syslog configuration
      brocade_logging_syslog_server:
        credential: "{{ credential }}"
        vfid: -1
        syslog_servers:
          - port: 514
            secure_mode: false
            server: "203.0.113.10"

    - name: SNMP system configuration
      brocade_snmp_system:
        credential: "{{ credential }}"
        vfid: -1
        snmp_system:
          audit_interval: 60
          contact: "Field Support."
          description: "DemoSwitch"
          encryption_enabled: false
          informs_enabled: true
          location: "Data Center 1"
          security_get_level_string: "authentication-and-privacy"
          security_set_level_string: "authentication-and-privacy"

    - name: SNMP v3 accounts - setup non-password attributes
      brocade_snmp_v3_account:
        credential: "{{ credential }}"
        vfid: -1
        v3_accounts:
          - index: 1
            authentication_protocol: "sha512"
            manager_engine_id: "00:00:00:00:00:00:00:00:00"
            privacy_protocol: "aes128"
            user_name: "asc-test"
          - index: 2
            authentication_protocol: "sha512"
            manager_engine_id: "00:00:00:00:00:00:00:00:00"
            privacy_protocol: "aes128"
            user_name: "snmp_admin_password"

    - name: SNMP v3 traps
      brocade_snmp_v3_trap:
        credential: "{{ credential }}"
        vfid: -1
        v3_traps:
          - trap_index: 1
            host: "198.51.100.2"
            informs_enabled: true
            port_number: 1011
            trap_severity_level: "warning"
            usm_index: 1
          - trap_index: 2
            host: "198.51.100.3"
            informs_enabled: false
            port_number: 1012
            trap_severity_level: "critical"
            usm_index: 2
          - trap_index: 3
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 3
          - trap_index: 4
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 4
          - trap_index: 5
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 5
          - trap_index: 6
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 6

    - name: Ipfilter policy is created or present
      brocade_security_ipfilter_policy:
        credential: "{{ credential }}"
        vfid: -1
        ipfilter_policies:
          - name: "Ipv4_telnet_http"
            ip_version: "IPv4"

    - name: Ipfilter rules are created or present
      brocade_security_ipfilter_rule:
        credential: "{{ credential }}"
        vfid: -1
        ipfilter_rules:
          - policy_name: "ipv4_telnet_http"
            index: 1
            destination_end_port: 22
            destination_ip: "any"
            destination_start_port: 22
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 2
            destination_end_port: 23
            destination_ip: "any"
            destination_start_port: 23
            permission: "deny"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 3
            destination_end_port: 80
            destination_ip: "any"
            destination_start_port: 80
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 4
            destination_end_port: 443
            destination_ip: "any"
            destination_start_port: 443
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 5
            destination_end_port: 161
            destination_ip: "any"
            destination_start_port: 161
            permission: "permit"
            protocol: "udp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 6
            destination_end_port: 123
            destination_ip: "any"
            destination_start_port: 123
            permission: "permit"
            protocol: "udp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 7
            destination_end_port: 1023
            destination_ip: "any"
            destination_start_port: 600
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 8
            destination_end_port: 1023
            destination_ip: "any"
            destination_start_port: 600
            permission: "permit"
            protocol: "udp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 9
            destination_end_port: 389
            destination_ip: "any"
            destination_start_port: 389
            permission: "permit"
            protocol: "tcp"
            source_ip: "any"
          - policy_name: "ipv4_telnet_http"
            index: 10
            destination_end_port: 389
            destination_ip: "any"
            destination_start_port: 389
            permission: "permit"
            protocol: "udp"
            source_ip: "any"

    - name: Ipfilter policy is activated or active already
      brocade_security_ipfilter_policy:
        credential: "{{ credential }}"
        vfid: -1
        active_policy: "ipv4_telnet_http"

    - name: Disable root & user
      brocade_security_user_config:
        credential: "{{ credential }}"
        vfid: -1
        user_configs:
          - name: "User"
            account_enabled: false
          - name: "Root"
            account_enabled: false

    - name: Add new account
      brocade_security_user_config:
        credential: "{{ credential }}"
        vfid: -1
        user_configs:
          - name: "Myaccount"
            password: "user_password"
            virtual_fabric_role_id_list:
              role_id:
                - "admin=1-128"
            chassis_access_role: "admin"
          - name: "Youraccount"
            password: "user_password"
            virtual_fabric_role_id_list:
              role_id:
                - "admin=1-128"
            chassis_access_role: "admin"

    - name: Configure relay server
      brocade_maps_maps_config:
        credential: "{{ credential }}"
        vfid: -1
        maps_config:
          relay_ip_address: "198.51.100.1"
          domain_name: "domain1.example.com"
          sender_address: "sender@domain1.example.com"
          recipient_address_list:
            recipient_address:
              - "receiver@domain1.example.com"
