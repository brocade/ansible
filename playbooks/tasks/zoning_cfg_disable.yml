- name: Disable zone configuration
  hosts: san_eng_zone_seed_san_a
  gather_facts: false

  vars:
    credential:
      fos_ip_addr: "{{ fos_ip_addr }}"
      fos_user_name: "{{ fos_user_name }}"
      fos_password: "{{ fos_password }}"
      https: "{{ fos_https }}"

  tasks:
    - name: Disable cfgs
      brocade_zoning_cfg_disable:
        credential: "{{ credential }}"
        vfid: -1
