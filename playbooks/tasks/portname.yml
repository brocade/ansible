- name: Configure port name
  hosts: san_eng_zone_seed_san_a
  gather_facts: false

  vars:
    credential:
      fos_ip_addr: "{{ fos_ip_addr }}"
      fos_user_name: "{{ fos_user_name }}"
      fos_password: "{{ fos_password }}"
      https: "{{ fos_https }}"

  tasks:
    - name: Set portname - user_friendly_name.
      brocade_interface_fibrechannel:
        credential: "{{ credential }}"
        vfid: -1
        ports:
          - name: "0/0"
            user_friendly_name: "my_port0"
