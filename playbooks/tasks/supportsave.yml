- name: Create support save
  hosts: san_eng_zone_seed_san_a
  gather_facts: false

  vars:
    credential:
      fos_ip_addr: "{{ fos_ip_addr }}"
      fos_user_name: "{{ fos_user_name }}"
      fos_password: "{{ fos_password }}"
      https: "{{ fos_https }}"
    supportsave:
      host: "198.51.100.254"
      user_name: "user_name"
      password: "user_password"
      remote_directory: "/directory_to_save"
        # protocol: "scp" # Uncomment this line if FOS version is lower than 10.x
      protocol_v2: "scp"    # Comment this line if FOS version is lower than 10.x

  tasks:
    - name: Initiate supportsave
      brocade_operation_supportsave:
        credential: "{{ credential }}"
        vfid: -1
        supportsave: "{{ supportsave }}"
      register: result

    - name: Print supportsave initial status
      ansible.builtin.debug:
        var: result.operation_resp

    - name: Show status
      brocade_operation_show_status:
        credential: "{{ credential }}"
        vfid: -1
        show_status:
          message_id: "{{ result.operation_resp.show_status.message_id }}"
      register: status_result
      until: >
        status_result.operation_resp is not defined or
        status_result.operation_resp.show_status.status == "done" or
        status_result.operation_resp.show_status.status == "delivered"
      retries: 150
      delay: 10

    - name: Print show_status end result
      ansible.builtin.debug:
        var: status_result.operation_resp
