- name: Apply switch configuration changes
  hosts: san_eng_zone_seed_san_a
  gather_facts: false

  vars:
    credential:
      fos_ip_addr: "{{ fos_ip_addr }}"
      fos_user_name: "{{ fos_user_name }}"
      fos_password: "{{ fos_password }}"
      https: "{{ fos_https }}"

  tasks:
    - name: Disable switch
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          enabled_state: false

    - name: Change all switch configuration
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          user_friendly_name: "new_switch_name"
          fabric_user_friendly_name: "new_fabric_name"
          domain_id: 2
          banner: "MORE AUTHORIZED USERS ONLY"
          dynamic_load_sharing: "two-hop-lossless-dls"
          domain_name: "example.com"
          dns_servers:
            dns_server:
              - "198.51.100.1"

    - name: Change all fabric configuration
      brocade_fibrechannel_configuration_fabric:
        credential: "{{ credential }}"
        vfid: -1
        fabric:
          insistent_domain_id_enabled: false
          in_order_delivery_enabled: true
          fabric_principal_enabled: false
          fabric_principal_priority: "0"
      register: result

      # - debug: var=result

    - name: >
        Change all port configuration. if running on a platform where credit
        recovery is supported, the line can be uncommented to update the mode.
      brocade_fibrechannel_configuration_port_configuration:
        credential: "{{ credential }}"
        vfid: -1
        port_configuration:
          dynamic_portname_format: "T.A.R"
          portname_mode: "off"
                # credit_recovery_mode: "off"

    - name: Enable switch
      brocade_fibrechannel_switch:
        credential: "{{ credential }}"
        vfid: -1
        switch:
          enabled_state: true

    - name: Change all chassis configuration
      brocade_chassis:
        credential: "{{ credential }}"
        vfid: -1
        chassis:
          chassis_user_friendly_name: "new_chassis_name"

    - name: Configure ports
      brocade_interface_fibrechannel:
        credential: "{{ credential }}"
        vfid: -1
        ports:
          - name: "0/0"
            enabled_state: true
            npiv_pp_limit: 126
          - name: "0/1"
            persistent_disable: false

    - name: Pause to make sure ports are configured
      ansible.builtin.pause:
        seconds: 15

    - name: Change all zoning configuration
      brocade_zoning_default_zone:
        credential: "{{ credential }}"
        vfid: -1
        default_zone_access: noaccess

    - name: Change all clock server configuration
      brocade_time_clock_server:
        credential: "{{ credential }}"
        vfid: -1
        clock_server:
          ntp_server_address:
            server_address:
              - "198.51.100.1"
              - "198.51.100.2"

    - name: Change all time zone configuration
      brocade_time_time_zone:
        credential: "{{ credential }}"
        vfid: -1
        time_zone:
          name: "Etc/UTC"

    - name: Change all audit configuration
      brocade_logging_audit:
        credential: "{{ credential }}"
        vfid: -1
        audit:
          audit_enabled: false
          filter_class_list:
            filter_class:
              - "zone"
              - "security"
              - "configuration"
              - "firmware"
              - "fabric"
              - "ls"
          severity_level: "warning"

    - name: Change all syslog configuration
      brocade_logging_syslog_server:
        credential: "{{ credential }}"
        vfid: -1
        syslog_servers:
          - port: 514
            secure_mode: false
            server: "198.51.100.1"

    - name: Change all SNMP system configuration
      brocade_snmp_system:
        credential: "{{ credential }}"
        vfid: -1
        snmp_system:
          audit_interval: 60
          contact: "more Field Support."
          description: "more DemoSwitch"
          encryption_enabled: true
          location: "Data Center 2"
          security_get_level_string: "authentication-and-privacy"
          security_set_level_string: "authentication-and-privacy"

    - name: SNMP v3 accounts - setup non-password attributes
      brocade_snmp_v3_account:
        credential: "{{ credential }}"
        vfid: -1
        v3_accounts:
          - index: 1
            authentication_protocol: "sha512"
            privacy_protocol: "aes128"
            user_name: "user_name"
          - index: 2
            authentication_protocol: "sha512"
            privacy_protocol: "aes128"
            user_name: "user_name"

    - name: SNMP v3 traps
      brocade_snmp_v3_trap:
        credential: "{{ credential }}"
        vfid: -1
        v3_traps:
          - trap_index: 1
            host: "198.51.100.1"
            informs_enabled: false
            port_number: xxxx
            trap_severity_level: "critical"
            usm_index: 1
          - trap_index: 2
            host: "198.51.100.1"
            informs_enabled: false
            port_number: xxxx
            trap_severity_level: "warning"
            usm_index: 2
          - trap_index: 3
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 3
          - trap_index: 4
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 4
          - trap_index: 5
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 5
          - trap_index: 6
            host: "0.0.0.0"
            informs_enabled: false
            port_number: 162
            trap_severity_level: "none"
            usm_index: 6

    - name: Change global inform attribute after removing all from v3 traps
      brocade_snmp_system:
        credential: "{{ credential }}"
        vfid: -1
        snmp_system:
          informs_enabled: false

    - name: Activate default ipv4 before deleting previously created custom policy
      brocade_security_ipfilter_policy:
        credential: "{{ credential }}"
        vfid: -1
        active_policy: "default_ipv4"

    - name: Delete custom policy
      brocade_security_ipfilter_policy:
        credential: "{{ credential }}"
        vfid: -1
        delete_policies:
          - name: "Ipv4_telnet_http"

    - name: Enable root & user
      brocade_security_user_config:
        credential: "{{ credential }}"
        vfid: -1
        user_configs:
          - name: "User"
            account_enabled: true
          - name: "Root"
            account_enabled: true

    - name: Delete accounts
      brocade_security_user_config:
        credential: "{{ credential }}"
        vfid: -1
        delete_user_configs:
          - name: "Myaccount"
          - name: "Youraccount"

    - name: Configure relay server
      brocade_maps_maps_config:
        credential: "{{ credential }}"
        vfid: -1
        maps_config:
          relay_ip_address: "198.51.100.1"
          domain_name: "domain2.example.com"
          sender_address: "sender@domain2.example.com"
          recipient_address_list:
            recipient_address:
              - "receiver@domain2.example.com"
