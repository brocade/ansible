- name: Download and activate firmware
  hosts: san_eng_zone_seed_san_a
  gather_facts: false

  vars:
    credential:
      fos_ip_addr: "{{ fos_ip_addr }}"
      fos_user_name: "{{ fos_user_name }}"
      fos_password: "{{ fos_password }}"
      https: "{{ fos_https }}"
    firmwaredownload:
      host: "198.51.100.254"
      user_name: "user_name"
      password: "user_password"
      remote_directory: "directory"
      protocol: "scp"
      eula_action: "accept-eula"
      stage: false

  tasks:
    - name: Initiate firmwaredownload
      brocade_operation_firmwaredownload:
        credential: "{{ credential }}"
        vfid: -1
        firmwaredownload: "{{ firmwaredownload }}"
      register: result

    - name: Wait for firmware sanity check to complete
      ansible.builtin.pause:
        minutes: 2

    - name: Print firmwaredownload initial status
      ansible.builtin.debug:
        var: result.operation_resp

    - name: >
        Show status before reboot. If connection refused error is returned
        during reboot, use showstatus.yml after reboot to view the current status.
      brocade_operation_show_status:
        credential: "{{ credential }}"
        vfid: -1
        show_status:
          message_id: "{{ result.operation_resp.show_status.message_id }}"
      register: status_result
      until: >
        status_result.operation_resp is not defined or
        status_result.operation_resp.show_status.status == "done" or
        status_result.operation_resp.show_status.status == "delivered"
      retries: 100
      delay: 10
      ignore_errors: true

    - name: Print show_status end result
      ansible.builtin.debug:
        var: status_result.operation_resp

  # pause for few minutes to make sure switch has rebooted
    - name: Pause for few minutes for switch reboot
      ansible.builtin.pause:
        minutes: 10

    - name: Show status after reboot
      brocade_operation_show_status:
        credential: "{{ credential }}"
        vfid: -1
        show_status:
          message_id: "{{ result.operation_resp.show_status.message_id }}"
      register: status_result
      until: >
        status_result.operation_resp is not defined or
        status_result.operation_resp.show_status.status == "done" or
        status_result.operation_resp.show_status.status == "delivered"
      retries: 100
      delay: 10

    - name: Print show_status end result after reboot after reboot
      ansible.builtin.debug:
        var: status_result.operation_resp
